name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Verify version matches tag
      - name: Verify version
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG"
            exit 1
          fi

      # Run full CI checks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Build
      - run: pnpm build

      # Verify binary works
      - run: node dist/index.js --help

      # Publish with provenance (OIDC trusted publishing — no NPM_TOKEN needed)
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_TOKEN is the fallback. With OIDC trusted publishing configured
          # on npmjs.com, provenance uses the GitHub OIDC token automatically.
          # To fully remove NPM_TOKEN, configure trusted publishing at:
          # https://www.npmjs.com → package settings → Trusted Publishers
